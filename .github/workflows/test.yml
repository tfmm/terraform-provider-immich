name: Test

on:
  push:
    branches:
      - main
      - '**'
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run Tests
        run: go test -v ./...

      - name: Verify Documentation Sync
        run: |
          go generate ./...
          git diff --exit-code || (echo "Docs are not up to date. Run 'go generate ./...' and commit changes." && exit 1)
